# SIGECAP J&V en Docker: MySQL 8.4 y la aplicación Swing.
# La ventana se muestra en Windows 11 mediante WSLg (Docker Desktop con WSL 2).
# Uso: docker compose up -d --build
name: sigecap-jv

services:
  db:
    image: mysql:8.4
    environment:
      TZ: America/Lima
      MYSQL_ROOT_PASSWORD: ${SIGECAP_MYSQL_ROOT_PASSWORD:?Defina SIGECAP_MYSQL_ROOT_PASSWORD en .env}
      # La cuenta de la aplicación la crea 002-permisos-app.sh con permisos mínimos.
      SIGECAP_DB_USER: sigecap_app
      SIGECAP_DB_PASSWORD: ${SIGECAP_DB_PASSWORD:?Defina SIGECAP_DB_PASSWORD en .env}
    volumes:
      - sigecap-datos:/var/lib/mysql
      - ./database/001-esquema.sql:/docker-entrypoint-initdb.d/001-esquema.sql:ro
      - ./database/docker/002-permisos-app.sh:/docker-entrypoint-initdb.d/002-permisos-app.sh:ro
    ports:
      # 3307 para no chocar con el MySQL local; solo accesible desde este equipo.
      - "127.0.0.1:${SIGECAP_DOCKER_DB_PORT:-3307}:3306"
    healthcheck:
      # Sano solo cuando el esquema ya existe y el usuario de la aplicación puede leerlo.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$SIGECAP_DB_PASSWORD\" mysql -h 127.0.0.1 -u \"$$SIGECAP_DB_USER\" -D sigecap_jv -Nse 'SELECT COUNT(*) FROM trabajador' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    restart: unless-stopped

  app:
    build: ./aplicacion
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Lima
      SIGECAP_DB_URL: jdbc:mysql://db:3306/sigecap_jv
      SIGECAP_DB_USER: sigecap_app
      SIGECAP_DB_PASSWORD: ${SIGECAP_DB_PASSWORD}
      DISPLAY: ":0"
      WAYLAND_DISPLAY: wayland-0
      XDG_RUNTIME_DIR: /mnt/wslg/runtime-dir
    volumes:
      - /run/desktop/mnt/host/wslg/.X11-unix:/tmp/.X11-unix
      - /run/desktop/mnt/host/wslg:/mnt/wslg
    # Al cerrar la ventana el contenedor termina; se vuelve a abrir con: docker compose up -d app
    restart: "no"

volumes:
  sigecap-datos:
